# Runs on every pull request and on pushes to main. Steps run in the order
# docs/IMPLEMENTATION_PLAN.md (chunk 0.13) sets; README > Continuous
# integration shows how to run the same steps locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the service container below. Local defaults, not secrets: the
  # database lives only for the job.
  TEST_DATABASE_URL: postgres://soleup:soleup@localhost:5432/soleup_test

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same image as docker-compose.yml. Starts empty, so the migrate step
        # below applies every migration from zero.
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: soleup
          POSTGRES_PASSWORD: soleup
          POSTGRES_DB: soleup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U soleup -d soleup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migrate from zero
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # With CI set, playwright.config.ts builds and starts the app itself
      # (NODE_ENV=test, build folder .next-e2e) against the test database.
      - name: E2E smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # drizzle-kit generate compares the schema with the committed migration
      # snapshots and does not connect, but drizzle.config.ts requires a URL.
      - name: Generate migrations
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Fail on schema drift
        run: |
          changes="$(git status --porcelain -- src/server/db/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::The schema and the committed migrations have drifted. Run pnpm db:generate and commit the result."
            echo "$changes"
            git --no-pager diff -- src/server/db/migrations
            exit 1
          fi
          echo "No drift: db:generate produced no changes."
